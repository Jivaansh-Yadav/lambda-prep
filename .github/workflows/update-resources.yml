name: Update resource datasets

# Re-crawls the Google Drive CISCE/Study-Materials folders, rebuilds the
# transform/split/sort/count datasets, and commits the regenerated JSON
# datasets back to the repo.
#
# Runs every Monday (03:23 UTC) and on demand: the admin panel's "Update
# resource datasets" button dispatches it with workflow_dispatch. Nothing in the
# datasets expires, so the cron is not a freshness requirement — it just means a
# Drive edit reaches the site without anyone pressing the button. A run with no
# upstream changes commits nothing — see the deterministic-counts note in
# scripts/count-resources.py.
#
# Every step name starts with a "[Category]" tag. The admin panel groups
# steps by that tag and shows live per-category progress while a run is in
# flight (GitHub's REST API exposes step status live, job logs only after
# the run finishes), so keep the tag when adding or renaming steps — an
# untagged step still shows up, under "Other".
on:
  workflow_dispatch: {}
  schedule:
    # Monday 03:23 UTC — deliberately off the hour: GitHub queues scheduled runs
    # behind cron jobs requested at :00, and delays them most around peak times.
    - cron: "23 3 * * 1"

permissions:
  contents: write

# Never let two dataset refreshes overlap: two crawls racing to push the
# same generated files would conflict, and the second commit would be
# rejected after wasting a full run.
concurrency:
  group: update-resource-datasets
  cancel-in-progress: false

jobs:
  update-resources:
    runs-on: ubuntu-latest
    # A hung Drive crawl used to be able to burn GitHub's 6h default.
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------
      # [Setup] — checkout + toolchains + Drive credentials
      # ------------------------------------------------------------------
      - name: "[Setup] Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "[Setup] Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "[Setup] Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[Setup] Fetch Google Drive credentials"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
        run: |
          # The service-account key lives in Neon (drive_integration), the same
          # row the app reads at runtime, so the crawl never holds a second copy
          # that can go stale after a key rotation. SERVICE_ACCOUNT is only a
          # fallback for a runner without database access.
          #
          # googleapis falls back to anonymous Application Default Credentials
          # when the key file is empty, which reports as "Method doesn't allow
          # unregistered callers" — a credential problem dressed up as a Drive
          # permission problem. Failing here keeps that confusion out of the log.
          node scripts/drive-crawl/fetch-credentials.mjs

      - name: "[Setup] Install Drive crawl dependencies"
        working-directory: scripts/drive-crawl
        run: npm install

      # ------------------------------------------------------------------
      # [Crawl] — the slowest phase; own step so its progress is visible
      # ------------------------------------------------------------------
      - name: "[Crawl] Crawl Google Drive folder tree"
        working-directory: scripts/drive-crawl
        run: node generate-drive-json.js

      # ------------------------------------------------------------------
      # [Datasets] — transform the crawl output into the committed JSON
      # ------------------------------------------------------------------
      - name: "[Datasets] Transform CISCE + Community resources"
        run: python3 scripts/transform-resources.py

      - name: "[Datasets] Split oversized datasets per subject"
        run: python3 scripts/split-resources-dataset.py

      - name: "[Datasets] Sort manifest subject order (Featured first, then A-Z)"
        run: python3 scripts/sort-manifest-subjects.py

      - name: "[Datasets] Count resources across all datasets"
        run: python3 scripts/count-resources.py

      # ------------------------------------------------------------------
      # [Commit] — clean up the secret, then commit whatever changed
      # ------------------------------------------------------------------
      - name: "[Commit] Remove service-account credentials"
        run: rm -f scripts/drive-crawl/service-account.json

      - name: "[Commit] Summarize dataset diff"
        run: |
          echo "### Dataset diff" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- src/data | tail -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "[Commit] Commit regenerated datasets"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No dataset changes — nothing to commit."
          else
            # No "[skip ci]" here on purpose: Cloudflare Pages honours it and
            # skips the build, which would leave the new datasets out of
            # production. This workflow is dispatch/cron only, so the bot's own
            # commit cannot re-trigger it — there is no loop to guard against.
            git commit -m "chore: regenerate resource datasets"
            git push
          fi
